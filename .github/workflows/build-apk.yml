name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Scaffold Flutter project (adds android/ios if missing, keeps existing pubspec.yaml)
        run: flutter create .

      - name: Set app display name to Hassala
        run: sed -i 's/android:label="[^"]*"/android:label="Hassala"/' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app icons (dollar sign)
        run: flutter pub run flutter_launcher_icons:main

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
